<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>


    
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
        .header { background: #2c3e50; color: white; padding: 20px; text-align: center; }
        .container { max-width: 400px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .container h2 { margin-top: 0; }
        .container form button { background: #2c3e50; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
        .container form button:hover { background: #34495e; }
        .errorlist { color: red; padding: 0; list-style: none; }
        .footer { background: #2c3e50; color: white; text-align: center; padding: 10px; position: fixed; bottom: 0; width: 100%; }
        a { color: #2c3e50; }
        input { width: 100%; padding: 8px; margin: 6px 0 16px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
    </style>
</head>




<body>
    <div class="header"><h1>Furniture Shop Inventory System</h1></div>
    <div class="container">
        <h2>Login</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="{% url 'signup' %}">Sign up here</a></p>
    </div>
    <div class="footer">&copy; 2026 Furniture Shop</div>
</body>
</html>
