<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Items</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 1rem 0;
            text-align: center;
        }
        .container {
            width: 80%;
            margin: auto;
            overflow: hidden;
        }
        .items-container {
            padding: 2rem 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 0.5rem;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #333;
            color: #fff;
        }
        .action-links {
            display: flex;
            gap: 0.5rem;
        }
        .action-links a {
            padding: 0.25rem 0.5rem;
            background-color: #333;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
        }
        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 1rem 0;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>View Items</h1>
        <p style="color: #fff; margin: 0;">Welcome, {{ user.username }} | <a href="{% url 'logout' %}" style="color: #fff;">Logout</a></p>
    </header>
    <div class="container">
        <div class="items-container">
            <table>
                <thead>
                    <tr>
                        <th>Sl. No.</th>
                        <th>Item Name</th>
                        <th>Material</th>
                        <th>Colour</th>
                        <th>Price</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for item in items %}
                    <tr>
                        <td>{{ forloop.counter }}</td>
                        <td>{{ item.item_name }}</td>
                        <td>{{ item.material }}</td>
                        <td>{{ item.colour }}</td>
                        <td>{{ item.price }}</td>
                        <td class="action-links">
                            <a href="{% url 'edit_item' item.id %}">Edit</a>
                            <a href="{% url 'delete_item' item.id %}">Delete</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
    <footer>
        <p>&copy; 2023 Furniture Shop. All rights reserved.</p>
    </footer>
</body>
</html>
