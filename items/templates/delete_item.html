<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Item</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 1rem 0;
            text-align: center;
        }
        .container {
            width: 80%;
            margin: auto;
            overflow: hidden;
        }
        .delete-container {
            padding: 2rem 0;
            text-align: center;
        }
        .delete-message {
            margin-bottom: 1rem;
        }
        .delete-actions {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }
        .delete-actions a, .delete-actions button {
            padding: 0.5rem 1rem;
            background-color: #333;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }
        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 1rem 0;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Delete Item</h1>
    </header>
    <div class="container">
        <div class="delete-container">
            <div class="delete-message">
                <p>Are you sure you want to delete "{{ item.item_name }}"?</p>
            </div>
            <div class="delete-actions">
                <form method="post">
                    {% csrf_token %}
                    <button type="submit">Delete</button>
                </form>
                <a href="{% url 'view_items' %}">Cancel</a>
            </div>
        </div>
    </div>
    <footer>
        <p>&copy; 2026 Furniture Shop. All rights reserved.</p>
    </footer>
</body>
</html>
