<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Item</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 1rem 0;
            text-align: center;
        }
        .container {
            width: 80%;
            margin: auto;
            overflow: hidden;
        }
        .form-container {
            padding: 2rem 0;
            text-align: center;
        }
        .form-group {
            margin-bottom: 1rem;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
        }
        input {
            width: 100%;
            padding: 0.5rem;
            box-sizing: border-box;
        }
        button {
            padding: 0.5rem 1rem;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 1rem 0;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Edit Item</h1>
    </header>
    <div class="container">
        <div class="form-container">
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="item_name">Item Name:</label>
                    <input type="text" id="item_name" name="item_name" value="{{ item.item_name }}" required>
                </div>
                <div class="form-group">
                    <label for="material">Material:</label>
                    <input type="text" id="material" name="material" value="{{ item.material }}" required>
                </div>
                <div class="form-group">
                    <label for="colour">Colour:</label>
                    <input type="text" id="colour" name="colour" value="{{ item.colour }}" required>
                </div>
                <div class="form-group">
                    <label ...
                    <input type="number" id="price" name="price" value="{{ item.price }}" required>
                </div>
                <button type="submit">Save Changes</button>
            </form>
        </div>
    </div>
    <footer>
        <p>&copy; 2023 Furniture Shop. All rights reserved.</p>
    </footer>
</body>
</html>
